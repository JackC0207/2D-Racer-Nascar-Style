<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO NASCAR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; background: #050505; 
            overflow: hidden; display: flex; justify-content: center; 
            align-items: center; font-family: 'Press Start 2P', cursive; color: #fff; 
        }
        body::before {
            content: " "; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 1000; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }
        #gameCanvas { width: 85vw; height: 85vh; object-fit: contain; background: #111; border: 8px solid #444; }
        .menu-container { 
            position: absolute; width: 85vw; height: 85vh; background: rgba(10,10,10,0.98); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 100; border: 8px solid #444; padding: 20px; 
        }
        #char-grid, #track-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 850px; margin-top: 10px; }
        .grid-card { background: #111; border: 2px solid #333; padding: 12px; cursor: pointer; text-align: center; font-size: 7px; color: #aaa; }
        .grid-card.selected { border-color: #00ff00; background: #002200; color: #00ff00; box-shadow: 0 0 15px #00ff00; }
        .difficulty-header { font-size: 10px; color: #ffff00; margin: 15px 0 5px 0; text-transform: uppercase; width: 100%; max-width: 850px; text-align: left; }
        .challenge-text { color: #ff0000 !important; }
        .swatch { width: 35px; height: 18px; margin: 5px auto; border: 1px solid #fff; }
        #preview-box { height: 60px; margin: 20px 0; display: flex; align-items: center; gap: 20px; font-size: 12px; }
        .preview-car-gfx { width: 50px; height: 30px; border: 3px solid #000; animation: rev 0.05s infinite; }
        @keyframes rev { 0% { transform: translateY(0); } 100% { transform: translateY(-2px); } }
        .menu-btn { 
            padding: 15px 40px; font-size: 16px; font-family: 'Press Start 2P', cursive; 
            background: #00ff00; color: #000; border: none; cursor: pointer; box-shadow: 4px 4px 0 #006600; 
        }
        .menu-btn:hover { background: #fff; box-shadow: 4px 4px 0 #888; }
        #ui-layer { position: absolute; top: 10%; left: 10%; background: rgba(0,0,0,0.8); padding: 15px; border: 3px solid #ff00ff; display: none; z-index: 10; font-size: 12px; }
        #leaderboard { position: absolute; top: 10%; right: 10%; background: rgba(0,0,0,0.8); padding: 12px; border: 3px solid #00ffff; width: 250px; display: none; font-size: 8px; line-height: 1.5; }
        #spotter { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); font-size: 16px; color: #00ff00; text-shadow: 3px 3px #000; display: none; }
        #track-name-display { position: absolute; top: 5%; left: 50%; transform: translateX(-50%); font-size: 14px; color: #fff; display: none; }
        #start-overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
        .light { width: 45px; height: 45px; border: 4px solid #333; background: #111; border-radius: 50%; }
        #win-screen { position: absolute; width: 500px; padding: 40px; background: #000; border: 10px double #fff; text-align: center; display: none; z-index: 500; box-shadow: 0 0 50px #fff; }
        #track-msg { color: #ff0000; font-size: 8px; margin-top: 10px; height: 10px; }
    </style>
</head>
<body>

    <div id="main-menu" class="menu-container">
        <h1 style="font-size: 32px; color: #ff0000; text-shadow: 3px 3px #fff; margin-bottom: 20px;">RETRO NASCAR</h1>
        <h2 style="font-size: 10px; color: #00ffff; margin-bottom: 10px;">SELECT YOUR DRIVER</h2>
        <div id="char-grid"></div>
        <div id="preview-box">
            <div id="preview-render" class="preview-car-gfx"></div>
            <div id="preview-name">SELECT DRIVER</div>
        </div>
        <button class="menu-btn" id="to-track-btn">CONFIRM DRIVER</button>
    </div>

    <div id="track-menu" class="menu-container" style="display: none;">
        <h1 style="font-size: 24px; color: #00ff00; margin-bottom: 20px;">CIRCUIT SELECT</h1>
        <div class="difficulty-header">Easy Mode</div>
        <div id="grid-easy" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; max-width: 850px;"></div>
        <div class="difficulty-header">Hard Mode</div>
        <div id="grid-hard" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; max-width: 850px;"></div>
        <div class="difficulty-header challenge-text">Challenge Mode</div>
        <div id="grid-challenge" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; max-width: 850px;"></div>
        <div id="track-msg"></div>
        <button class="menu-btn" id="start-btn" style="margin-top: 20px;">START ENGINE</button>
    </div>

    <div id="start-overlay">
        <div style="display: flex; gap: 20px;">
            <div class="light" id="l1"></div><div class="light" id="l2"></div><div class="light" id="l3"></div><div class="light" id="l4"></div><div class="light" id="l5"></div>
        </div>
    </div>

    <div id="win-screen">
        <h2 style="color: #ffff00; font-size: 24px; margin-bottom: 20px;">CHECKERED FLAG!</h2>
        <div id="winner-name" style="font-size: 18px; color: #fff; margin-bottom: 30px;">---</div>
        <button class="menu-btn" onclick="location.reload()">RACE AGAIN</button>
    </div>

    <div id="ui-layer">
        <div>LAP <span id="lap-display">0/15</span></div>
        <div style="color: #ffff00; margin-top: 10px;"><span id="speed-display">0</span> MPH</div>
    </div>
    <div id="track-name-display"></div>
    <div id="leaderboard"><div id="board-content"></div></div>
    <div id="spotter">READY</div>

    <canvas id="gameCanvas" width="1500" height="700"></canvas>

    <script>
        // GLOBAL DATA
const PROFILES = [
    {c1: "#ffffff", c2: "#ff0000", n: "Smelly Myron"},
    {c1: "#800000", c2: "#000000", n: "Axe VerCrapon"},
    {c1: "#ff0000", c2: "#ffff00", n: "Poopy Hamilton"},
    {c1: "#ffffff", c2: "#000000", n: "Austin Spindric"},
    {c1: "#800080", c2: "#00ffff", n: "Big Bubba"},
    {c1: "#000000", c2: "#800000", n: "Van Gisburger"},
    {c1: "#ffff00", c2: "#ff0000", n: "Walter Logano"},
    {c1: "#32cd32", c2: "#ff0000", n: "Danica WrecksAlot"},
    {c1: "#ff8c00", c2: "#000000", n: "Oscar Pistrami"},
    {c1: "#000000", c2: "#006400", n: "O. Ben Russel"},
    {c1: "#00ffff", c2: "#00008b", n: "Mellon Man"},
    {c1: "#44ccff", c2: "#ffffff", n: "The King"}
];

const TRACKS = {
    easy: ["Bristol", "Daytona"],
    hard: ["Talladega", "Martinsville"], 
    challenge: ["Indianapolis"]
};

const IMPLEMENTED_TRACKS = ["Martinsville", "Daytona", "Bristol", "Talladega", "Indianapolis"];

// --- SHARED GLOBAL STATE ---
var cars = [];
var keys = {};
var raceStarted = false;
var raceOver = false;
var selectedDriverIndex = 0;
var selectedTrack = "Daytona"; 
var lastTime = 0;
var dt = 0;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Build Driver Grid
PROFILES.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = `grid-card ${i === 0 ? 'selected' : ''}`;
    card.innerHTML = `<div class="swatch" style="background:linear-gradient(90deg, ${p.c1} 50%, ${p.c2} 50%)"></div>${p.n}`;
    card.onclick = () => {
        document.querySelectorAll('#char-grid .grid-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected'); 
        selectedDriverIndex = i;
        document.getElementById('preview-render').style.background = `linear-gradient(180deg, ${p.c1} 50%, ${p.c2} 50%)`;
        document.getElementById('preview-name').innerText = p.n;
    };
    document.getElementById('char-grid').appendChild(card);
});

// Build Track Grid
["easy", "hard", "challenge"].forEach(diff => {
    const container = document.getElementById(`grid-${diff}`);
    TRACKS[diff].forEach(tName => {
        const card = document.createElement('div');
        card.className = `grid-card ${tName === "Daytona" ? 'selected' : ''}`;
        if(diff === "challenge") card.classList.add('challenge-text');
        card.innerText = tName;
        card.onclick = () => {
            document.querySelectorAll('#track-menu .grid-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedTrack = tName;
            document.getElementById('track-msg').innerText = ""; 
        };
        container.appendChild(card);
    });
});

document.getElementById('to-track-btn').onclick = () => {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('track-menu').style.display = 'flex';
};

// --- ENGINE START LOGIC ---
document.getElementById('start-btn').onclick = () => {
    if (!IMPLEMENTED_TRACKS.includes(selectedTrack)) {
        document.getElementById('track-msg').innerText = "TRACK NOT YET IMPLEMENTED";
        return;
    }

    const script = document.createElement('script');
    script.src = `${selectedTrack}.js`;
    script.onload = () => {
        cars = PROFILES.map((p, i) => new Car(p, i === selectedDriverIndex));
        document.getElementById('track-menu').style.display = 'none';
        document.getElementById('start-overlay').style.display = 'flex';
        document.getElementById('track-name-display').innerText = selectedTrack.toUpperCase();
        lastTime = performance.now();
        initiateCountdown();
        requestAnimationFrame((t) => loop(t, ctx, canvas));
    };
    document.body.appendChild(script);
};

async function initiateCountdown() {
    const lights = [1,2,3,4,5].map(i => document.getElementById(`l${i}`));
    for(let l of lights) { 
        await new Promise(r => setTimeout(r, 600)); 
        l.style.background = "#ff0000"; 
    }
    await new Promise(r => setTimeout(r, 1000));
    lights.forEach(l => l.style.background = "#00ff00");
    
    raceStarted = true;
    
    document.getElementById('ui-layer').style.display = 'block';
    document.getElementById('leaderboard').style.display = 'block';
    document.getElementById('spotter').style.display = 'block';
    document.getElementById('track-name-display').style.display = 'block';
    setTimeout(() => document.getElementById('start-overlay').style.display = 'none', 800);
}

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
    </script>
</body>
</html>
